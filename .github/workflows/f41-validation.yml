name: F41 Monte Carlo and Adversarial Validation

on:
  pull_request:
    paths:
      - "backtest/robustness/**"
      - "backtest/engine/**"
      - "tests/unit/test_robustness.py"
      - "docs/ROBUSTNESS_F41.md"
      - ".github/workflows/f41-validation.yml"
  push:
    branches: [main]
    paths:
      - "backtest/robustness/**"
      - "tests/unit/test_robustness.py"
      - "docs/ROBUSTNESS_F41.md"
      - ".github/workflows/f41-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run F41 tests
        run: python -m pytest tests/unit/test_robustness.py -q
      - name: Lint F41 implementation
        run: python -m ruff check backtest/robustness tests/unit/test_robustness.py
      - name: Check F41 formatting
        run: python -m ruff format --check backtest/robustness tests/unit/test_robustness.py
      - name: Type-check F41 implementation
        run: python -m mypy backtest/robustness
