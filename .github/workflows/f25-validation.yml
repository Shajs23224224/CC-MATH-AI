name: F25 Derivatives

on:
  push:
    branches: ["phase-25-derivatives"]
    paths:
      - "core/contracts/derivatives.py"
      - "core/contracts/__init__.py"
      - "quant/derivatives/**"
      - "tests/numerical/test_derivatives_references.py"
      - "docs/DERIVATIVES.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f25-validation.yml"
  pull_request:
    paths:
      - "core/contracts/derivatives.py"
      - "core/contracts/__init__.py"
      - "quant/derivatives/**"
      - "tests/numerical/test_derivatives_references.py"
      - "docs/DERIVATIVES.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f25-validation.yml"

permissions:
  contents: read

jobs:
  validate-f25:
    name: Validate option pricing, Greeks and implied volatility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/derivatives.py core/contracts/__init__.py quant/derivatives tests/numerical/test_derivatives_references.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/derivatives.py core/contracts/__init__.py quant/derivatives tests/numerical/test_derivatives_references.py
      - name: Mypy
        run: python -m mypy core/contracts/derivatives.py quant/derivatives
      - name: F25 numerical and contract tests
        run: python -m pytest tests/numerical/test_derivatives_references.py -q
      - name: F21-F24 regression tests
        run: python -m pytest tests/numerical/test_risk_engine.py tests/unit/test_risk_engine_contracts.py tests/numerical/test_tail_risk.py tests/unit/test_tail_risk_contracts.py tests/numerical/test_dependence_references.py tests/numerical/test_cointegration_references.py -q
