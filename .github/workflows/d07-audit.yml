name: D07 execution audit and simulation

on:
  push:
    branches:
      - feature/cc-math-ai-d07-execution-audit
  pull_request:
    branches:
      - feature/cc-math-ai-d01-d06

permissions:
  contents: read

jobs:
  audit-quality:
    name: Python ${{ matrix.python-version }} D07 audit and simulation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev,dashboard]"

      - name: Ruff lint
        run: >-
          ruff check
          scripts/audit_execution_decision_policy.py
          scripts/simulate_execution_decisions.py
          tests/unit/test_audit_execution_decision_policy.py
          tests/unit/test_simulate_execution_decisions.py

      - name: Ruff format check
        run: >-
          ruff format --check
          scripts/audit_execution_decision_policy.py
          scripts/simulate_execution_decisions.py
          tests/unit/test_audit_execution_decision_policy.py
          tests/unit/test_simulate_execution_decisions.py

      - name: D04-D06 regression and D07.1-D07.2 tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          pytest -q
          tests/unit/test_audit_execution_decision_policy.py
          tests/unit/test_simulate_execution_decisions.py
          tests/unit/test_execution_dataset.py
          tests/unit/test_execution_ml_walk_forward.py
          tests/unit/test_execution_decision_policy.py
          tests/unit/test_ml_walk_forward.py
          tests/unit/test_training_dataset_snapshots.py
          tests/unit/test_classical_ml.py
          tests/unit/test_gradient_boosting.py
