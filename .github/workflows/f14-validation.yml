name: F14 Returns Validation

on:
  push:
    paths:
      - "core/contracts/returns.py"
      - "core/contracts/__init__.py"
      - "quant/returns/**"
      - "quant/__init__.py"
      - "tests/numerical/test_returns_performance.py"
      - ".github/workflows/f14-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    name: F14 returns and performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint — F14 scope
        run: |
          python -m ruff check             core/contracts/returns.py             core/contracts/__init__.py             quant/returns             quant/__init__.py             tests/numerical/test_returns_performance.py

      - name: Ruff format — F14 scope
        run: |
          python -m ruff format --check             core/contracts/returns.py             core/contracts/__init__.py             quant/returns             quant/__init__.py             tests/numerical/test_returns_performance.py

      - name: Mypy — F14 scope
        run: |
          python -m mypy             core/contracts/returns.py             quant/returns             quant/__init__.py             tests/numerical/test_returns_performance.py

      - name: Numerical tests
        run: python -m pytest tests/numerical/test_returns_performance.py -q
