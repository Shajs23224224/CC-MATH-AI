name: F24 Cointegration and Statistical Arbitrage

on:
  push:
    branches: ["phase-24-cointegration-stat-arb"]
    paths:
      - "core/contracts/cointegration.py"
      - "core/contracts/__init__.py"
      - "quant/cointegration/**"
      - "tests/numerical/test_cointegration_references.py"
      - "docs/COINTEGRATION.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/f24-validation.yml"
  pull_request:
    paths:
      - "core/contracts/cointegration.py"
      - "core/contracts/__init__.py"
      - "quant/cointegration/**"
      - "tests/numerical/test_cointegration_references.py"
      - "docs/COINTEGRATION.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/f24-validation.yml"

permissions:
  contents: read

jobs:
  validate-f24:
    name: Validate unit-root tests, cointegration and pairs statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/cointegration.py core/contracts/__init__.py quant/cointegration tests/numerical/test_cointegration_references.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/cointegration.py core/contracts/__init__.py quant/cointegration tests/numerical/test_cointegration_references.py
      - name: Mypy
        run: python -m mypy core/contracts/cointegration.py quant/cointegration
      - name: F24 numerical and unit tests
        run: python -m pytest tests/numerical/test_cointegration_references.py -q
      - name: F21/F22/F23 regression tests
        run: python -m pytest tests/numerical/test_risk_engine.py tests/unit/test_risk_engine_contracts.py tests/numerical/test_tail_risk.py tests/unit/test_tail_risk_contracts.py tests/numerical/test_dependence_references.py -q
