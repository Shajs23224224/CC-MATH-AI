name: F29 Gradient Boosting

on:
  push:
    branches: ["feature/f29-gradient-boosting"]
    paths:
      - "ml/classical.py"
      - "tests/unit/test_gradient_boosting.py"
      - "tests/unit/test_classical_ml.py"
      - "docs/GRADIENT_BOOSTING.md"
      - "docs/CLASSICAL_ML.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f29-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "ml/classical.py"
      - "tests/unit/test_gradient_boosting.py"
      - "tests/unit/test_classical_ml.py"
      - "docs/GRADIENT_BOOSTING.md"
      - "docs/CLASSICAL_ML.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f29-validation.yml"

permissions:
  contents: read

jobs:
  validate-f29:
    name: Validate temporal gradient boosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/ml.py ml tests/unit/test_gradient_boosting.py tests/unit/test_classical_ml.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/ml.py ml tests/unit/test_gradient_boosting.py tests/unit/test_classical_ml.py
      - name: Mypy
        run: python -m mypy core/contracts/ml.py ml
      - name: F29 gradient boosting tests
        run: python -m pytest tests/unit/test_gradient_boosting.py tests/unit/test_classical_ml.py -q
      - name: F28 adaptive and discovery regressions
        run: python -m pytest tests/unit/test_adaptive_math.py tests/unit/test_pattern_discovery.py tests/unit/test_experiment_store.py tests/numerical/test_symbolic_discovery.py -q
      - name: F27 causal walk-forward regression
        run: python -m pytest tests/numerical/test_probabilistic_forecasting.py -q
      - name: F26 regime regression
        run: python -m pytest tests/numerical/test_regime_detection.py -q
      - name: F21-F25 risk and quantitative regression
        run: python -m pytest tests/numerical/test_risk_engine.py tests/unit/test_risk_engine_contracts.py tests/numerical/test_tail_risk.py tests/unit/test_tail_risk_contracts.py tests/numerical/test_dependence_references.py tests/numerical/test_cointegration_references.py tests/numerical/test_derivatives_references.py -q
