name: F26 Regime Detection

on:
  push:
    branches: ["phase-26-regime-detection"]
    paths:
      - "core/contracts/regimes.py"
      - "core/contracts/__init__.py"
      - "quant/regimes/**"
      - "tests/numerical/test_regime_detection.py"
      - "docs/REGIME_DETECTION.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f26-validation.yml"
  pull_request:
    paths:
      - "core/contracts/regimes.py"
      - "core/contracts/__init__.py"
      - "quant/regimes/**"
      - "tests/numerical/test_regime_detection.py"
      - "docs/REGIME_DETECTION.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f26-validation.yml"

permissions:
  contents: read

jobs:
  validate-f26:
    name: Validate latent regimes and change-point detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/regimes.py core/contracts/__init__.py quant/regimes tests/numerical/test_regime_detection.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/regimes.py core/contracts/__init__.py quant/regimes tests/numerical/test_regime_detection.py
      - name: Mypy
        run: python -m mypy core/contracts/regimes.py quant/regimes
      - name: F26 numerical and contract tests
        run: python -m pytest tests/numerical/test_regime_detection.py -q
      - name: F21-F25 regression tests
        run: python -m pytest tests/numerical/test_risk_engine.py tests/unit/test_risk_engine_contracts.py tests/numerical/test_tail_risk.py tests/unit/test_tail_risk_contracts.py tests/numerical/test_dependence_references.py tests/numerical/test_cointegration_references.py tests/numerical/test_derivatives_references.py -q
