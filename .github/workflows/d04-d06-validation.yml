name: D04-D06 Execution Research Validation

on:
  pull_request:
    paths:
      - "scripts/build_execution_dataset.py"
      - "scripts/run_execution_decision_policy.py"
      - "scripts/run_execution_ml_walk_forward.py"
      - "scripts/run_ml_walk_forward.py"
      - "tests/unit/test_execution_dataset.py"
      - "tests/unit/test_execution_decision_policy.py"
      - "tests/unit/test_execution_ml_walk_forward.py"
      - "core/contracts/ml.py"
      - "ml/**"
      - "pyproject.toml"
      - ".github/workflows/d04-d06-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build_execution_dataset.py"
      - "scripts/run_execution_decision_policy.py"
      - "scripts/run_execution_ml_walk_forward.py"
      - "scripts/run_ml_walk_forward.py"
      - "tests/unit/test_execution_dataset.py"
      - "tests/unit/test_execution_decision_policy.py"
      - "tests/unit/test_execution_ml_walk_forward.py"
      - "core/contracts/ml.py"
      - "ml/**"
      - "pyproject.toml"
      - ".github/workflows/d04-d06-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d04-d06-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run D04-D06 and dependent D05 tests
        run: |
          python -m pytest -q \
            tests/unit/test_execution_dataset.py \
            tests/unit/test_execution_ml_walk_forward.py \
            tests/unit/test_execution_decision_policy.py \
            tests/unit/test_ml_walk_forward.py
      - name: Run related estimator regression tests
        run: |
          python -m pytest -q \
            tests/unit/test_classical_ml.py \
            tests/unit/test_gradient_boosting.py
      - name: Ruff lint
        run: |
          python -m ruff check \
            scripts/build_execution_dataset.py \
            scripts/run_execution_decision_policy.py \
            tests/unit/test_execution_dataset.py \
            tests/unit/test_execution_decision_policy.py
      - name: Ruff format
        run: |
          python -m ruff format --check \
            scripts/build_execution_dataset.py \
            scripts/run_execution_decision_policy.py \
            tests/unit/test_execution_dataset.py \
            tests/unit/test_execution_decision_policy.py
