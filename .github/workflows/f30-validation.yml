name: F30 Unsupervised ML

on:
  push:
    branches: ["feature/f30-unsupervised-ml"]
    paths:
      - "core/contracts/unsupervised.py"
      - "ml/unsupervised.py"
      - "ml/__init__.py"
      - "tests/unit/test_unsupervised_ml.py"
      - "docs/UNSUPERVISED_ML.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f30-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "core/contracts/unsupervised.py"
      - "ml/unsupervised.py"
      - "ml/__init__.py"
      - "tests/unit/test_unsupervised_ml.py"
      - "docs/UNSUPERVISED_ML.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f30-validation.yml"

permissions:
  contents: read

jobs:
  validate-f30:
    name: Validate leakage-aware unsupervised ML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/unsupervised.py ml/unsupervised.py ml/__init__.py tests/unit/test_unsupervised_ml.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/unsupervised.py ml/unsupervised.py ml/__init__.py tests/unit/test_unsupervised_ml.py
      - name: Mypy
        run: python -m mypy core/contracts/unsupervised.py ml/unsupervised.py
      - name: F30 behavioral tests
        run: python -m pytest tests/unit/test_unsupervised_ml.py -q
      - name: F29 regression
        run: python -m pytest tests/unit/test_gradient_boosting.py tests/unit/test_classical_ml.py -q
      - name: F28 regression
        run: python -m pytest tests/unit/test_adaptive_math.py tests/unit/test_pattern_discovery.py tests/unit/test_experiment_store.py tests/numerical/test_symbolic_discovery.py -q
