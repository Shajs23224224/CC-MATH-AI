name: F36 Portfolio Optimization

on:
  push:
    branches: ["feature/f36-portfolio-optimization"]
    paths:
      - "portfolio/**"
      - "signals/decision/**"
      - "core/contracts/portfolio.py"
      - "tests/unit/test_portfolio_optimization.py"
      - "tests/unit/test_decision_engine.py"
      - "tests/unit/test_quant_ensemble.py"
      - "tests/unit/test_algorithm_registry.py"
      - "quant/registry/**"
      - "docs/ALGORITHM_REGISTRY.md"
      - "tests/numerical/test_dependence_references.py"
      - "tests/numerical/test_risk_engine.py"
      - "docs/PORTFOLIO_OPTIMIZATION.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f36-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "portfolio/**"
      - "signals/decision/**"
      - "core/contracts/portfolio.py"
      - "tests/unit/test_portfolio_optimization.py"
      - "tests/unit/test_decision_engine.py"
      - "tests/unit/test_quant_ensemble.py"
      - "tests/unit/test_algorithm_registry.py"
      - "tests/numerical/test_dependence_references.py"
      - "tests/numerical/test_risk_engine.py"
      - "docs/PORTFOLIO_OPTIMIZATION.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f36-validation.yml"

permissions:
  contents: read

jobs:
  validate-f36:
    name: Validate portfolio optimization and upstream contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: |
          python -m ruff check portfolio/optimization quant/registry/builtins.py
          python -m ruff check tests/unit/test_portfolio_optimization.py tests/unit/test_algorithm_registry.py signals/decision
      - name: Ruff format check
        run: |
          python -m ruff format --check portfolio/optimization quant/registry/builtins.py
          python -m ruff format --check tests/unit/test_portfolio_optimization.py tests/unit/test_algorithm_registry.py
      - name: Mypy
        run: python -m mypy portfolio/optimization quant/registry
      - name: F36 behavioral tests
        run: python -m pytest tests/unit/test_portfolio_optimization.py -q
      - name: F35/F34/F33 regression
        run: python -m pytest tests/unit/test_decision_engine.py tests/unit/test_quant_ensemble.py tests/unit/test_algorithm_registry.py -q
      - name: F23/F21 numerical regression
        run: python -m pytest tests/numerical/test_dependence_references.py tests/numerical/test_risk_engine.py -q
