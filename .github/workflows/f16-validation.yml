name: F16 Technical Analysis Validation

on:
  push:
    paths:
      - "core/contracts/technical.py"
      - "quant/technical/**"
      - "tests/numerical/test_technical_analysis.py"
      - ".github/workflows/f16-validation.yml"
  pull_request:
    paths:
      - "core/contracts/technical.py"
      - "quant/technical/**"
      - "tests/numerical/test_technical_analysis.py"
      - ".github/workflows/f16-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-f16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check core/contracts/technical.py quant/technical tests/numerical/test_technical_analysis.py
      - name: Ruff format
        run: ruff format --check core/contracts/technical.py quant/technical tests/numerical/test_technical_analysis.py
      - name: Mypy
        run: mypy core/contracts/technical.py quant/technical
      - name: Numerical tests
        run: pytest tests/numerical/test_technical_analysis.py
