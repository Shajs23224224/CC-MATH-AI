name: F15 Statistical Engine

on:
  push:
    branches: [main]
    paths:
      - "core/contracts/statistics.py"
      - "core/contracts/__init__.py"
      - "quant/statistics/**"
      - "quant/__init__.py"
      - "tests/numerical/test_statistical_engine.py"
      - ".github/workflows/f15-validation.yml"
  pull_request:
    paths:
      - "core/contracts/statistics.py"
      - "core/contracts/__init__.py"
      - "quant/statistics/**"
      - "quant/__init__.py"
      - "tests/numerical/test_statistical_engine.py"
      - ".github/workflows/f15-validation.yml"

jobs:
  validate-f15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/statistics.py core/contracts/__init__.py quant/statistics quant/__init__.py tests/numerical/test_statistical_engine.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/statistics.py core/contracts/__init__.py quant/statistics quant/__init__.py tests/numerical/test_statistical_engine.py
      - name: Mypy
        run: python -m mypy core/contracts/statistics.py quant/statistics quant/__init__.py
      - name: Numerical tests
        run: python -m pytest tests/numerical/test_statistical_engine.py -q
