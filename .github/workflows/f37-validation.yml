name: F37 Position Sizing

on:
  push:
    branches: ["feature/f37-position-sizing"]
    paths:
      - "portfolio/sizing/**"
      - "portfolio/optimization/**"
      - "signals/decision/**"
      - "tests/unit/test_position_sizing.py"
      - "tests/unit/test_portfolio_optimization.py"
      - "tests/unit/test_decision_engine.py"
      - "tests/unit/test_quant_ensemble.py"
      - "tests/unit/test_algorithm_registry.py"
      - "quant/registry/**"
      - "risk/**"
      - "docs/POSITION_SIZING.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f37-validation.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "portfolio/sizing/**"
      - "portfolio/optimization/**"
      - "signals/decision/**"
      - "tests/unit/test_position_sizing.py"
      - "tests/unit/test_portfolio_optimization.py"
      - "tests/unit/test_decision_engine.py"
      - "tests/unit/test_quant_ensemble.py"
      - "tests/unit/test_algorithm_registry.py"
      - "quant/registry/**"
      - "risk/**"
      - "docs/POSITION_SIZING.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - ".github/workflows/f37-validation.yml"

permissions:
  contents: read

jobs:
  validate-f37:
    name: Validate F37 position sizing and upstream controls
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check portfolio/sizing portfolio/optimization quant/registry/builtins.py tests/unit/test_position_sizing.py tests/unit/test_algorithm_registry.py
      - name: Ruff format check
        run: python -m ruff format --check portfolio/sizing portfolio/optimization quant/registry/builtins.py tests/unit/test_position_sizing.py tests/unit/test_algorithm_registry.py
      - name: Mypy
        run: python -m mypy portfolio/sizing portfolio/optimization quant/registry
      - name: F37 behavioral tests
        run: python -m pytest tests/unit/test_position_sizing.py -q
      - name: F36/F35/F34/F33 regression
        run: python -m pytest tests/unit/test_portfolio_optimization.py tests/unit/test_decision_engine.py tests/unit/test_quant_ensemble.py tests/unit/test_algorithm_registry.py -q
      - name: F23/F21 numerical regression
        run: python -m pytest tests/numerical/test_dependence_references.py tests/numerical/test_risk_engine.py -q
