name: F28 Adaptive Math and Classical ML

on:
  push:
    branches: ["phase-28-classical-ml"]
    paths:
      - "core/contracts/ml.py"
      - "core/contracts/adaptive_math.py"
      - "core/contracts/__init__.py"
      - "ml/**"
      - "tests/unit/test_adaptive_math.py"
      - "tests/unit/test_classical_ml.py"
      - "tests/unit/test_pattern_discovery.py"
      - "tests/unit/test_experiment_store.py"
      - "tests/numerical/test_symbolic_discovery.py"
      - "docs/ADAPTIVE_MATH.md"
      - "docs/CLASSICAL_ML.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/f28-validation.yml"
  pull_request:
    paths:
      - "docs/ADAPTIVE_MATH.md"
      - "tests/unit/test_adaptive_math.py"
      - "core/contracts/adaptive_math.py"
      - "core/contracts/ml.py"
      - "core/contracts/__init__.py"
      - "ml/**"
      - "tests/unit/test_classical_ml.py"
      - "tests/unit/test_pattern_discovery.py"
      - "tests/unit/test_experiment_store.py"
      - "tests/numerical/test_symbolic_discovery.py"
      - "docs/CLASSICAL_ML.md"
      - "docs/ROADMAP_F16_F42.md"
      - "README.md"
      - "pyproject.toml"
      - ".github/workflows/f28-validation.yml"

permissions:
  contents: read

jobs:
  validate-f28:
    name: Validate classical ML and symbolic discovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check core/contracts/ml.py core/contracts/adaptive_math.py core/contracts/__init__.py ml tests/unit/test_adaptive_math.py tests/unit/test_classical_ml.py tests/unit/test_pattern_discovery.py tests/unit/test_experiment_store.py tests/numerical/test_symbolic_discovery.py
      - name: Ruff format check
        run: python -m ruff format --check core/contracts/ml.py core/contracts/adaptive_math.py core/contracts/__init__.py ml tests/unit/test_adaptive_math.py tests/unit/test_classical_ml.py tests/unit/test_pattern_discovery.py tests/unit/test_experiment_store.py tests/numerical/test_symbolic_discovery.py
      - name: Mypy
        run: python -m mypy core/contracts/ml.py core/contracts/adaptive_math.py ml
      - name: F28 behavioral tests
        run: python -m pytest tests/unit/test_adaptive_math.py tests/unit/test_classical_ml.py tests/unit/test_pattern_discovery.py tests/unit/test_experiment_store.py tests/numerical/test_symbolic_discovery.py -q
      - name: F27 causal walk-forward regression
        run: python -m pytest tests/numerical/test_probabilistic_forecasting.py -q
      - name: F26 regime regression
        run: python -m pytest tests/numerical/test_regime_detection.py -q
      - name: F21-F25 risk and quantitative regression
        run: python -m pytest tests/numerical/test_risk_engine.py tests/unit/test_risk_engine_contracts.py tests/numerical/test_tail_risk.py tests/unit/test_tail_risk_contracts.py tests/numerical/test_dependence_references.py tests/numerical/test_cointegration_references.py tests/numerical/test_derivatives_references.py -q
