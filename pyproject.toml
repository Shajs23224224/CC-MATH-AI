[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c-math-ai"
version = "0.1.0"
description = "Quantitative research and investment decision-support platform."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<2",
  "mypy>=1.11,<2",
]

[tool.setuptools.packages.find]
include = [
  "core*",
  "data*",
  "quant*",
  "ml*",
  "signals*",
  "portfolio*",
  "risk*",
  "backtest*",
  "execution*",
  "config*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
