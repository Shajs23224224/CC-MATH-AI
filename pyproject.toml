[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c-math-ai"
version = "0.1.0"
description = "Quantitative research and investment decision-support platform."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "numpy>=2.0,<2.5",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "scipy>=1.13,<2",
  "statsmodels>=0.14,<1",
  "arch>=7,<9",
  "scikit-learn>=1.7,<2",
  "fastapi>=0.115,<1",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dashboard = [
  "uvicorn>=0.30,<1",
]
deep-learning = [
  "torch>=2.4,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<2",
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "scipy-stubs>=1.17,<1.18",
  "pip-audit>=2.7,<3",
  "httpx>=0.27,<1",
  "httpx2>=2.16,<3",
]

[tool.setuptools.packages.find]
include = [
  "core*",
  "data*",
  "quant*",
  "ml*",
  "signals*",
  "portfolio*",
  "risk*",
  "backtest*",
  "execution*",
  "apps*",
  "config*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"apps.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]
